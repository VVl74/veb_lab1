<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа 1</title>
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="judaism.png">
    <style>
        .page {
            width: 100%;
        }
        .zagolov {
            font-family: monospace;
            color: #dc0be3;
            font-size: 24px;
        }

        .header {
            font-family: cursive;
            color: #dc0be3;
            font-size: 42px;
            font-weight: bold;
            text-align: center;
        }
        .pict {
            max-width: 400px;
            text-align: center;
            vertical-align: top;
        }

        .results th,
        .results td {
            border: 1px;
            padding: 6px;
            background-color: #dc0be3;
        }

        button {
            padding: 8px;
        }

        /* селектор идентификатора */
        #y {
            padding: 8px;
            margin: 8px;
        }

        /* селектор атрибута */
        input[type="checkbox"] {
            margin: 4px;
        }

        /* селектор детей */
        td > button {
            margin: 8px;
        }

        /* наследование */
        table {
            font-family: Arial, sans-serif;
        }

        /* каскад */
        input {
            padding: 4px;
        }
        input[type="text"] {
            padding: 8px;
        }
    </style>
</head>
<body>
<h1 class = "zagolov">Вейгандт Владислав 501465 Вариант 12614</h1>
<table class = "page">
    <header>
        <tr>
            <td><p>Ввод</p> </td>
            <td><p>картинка</p> </td>
            <td><p>вывод</p> </td>
        </tr>
    </header>
    <tr>
        <td>
            <p>X:</p>
            <label><input type="checkbox" name="x" value="-4"> -4</label>
            <label><input type="checkbox" name="x" value="-3"> -3</label>
            <label><input type="checkbox" name="x" value="-2"> -2</label>
            <label><input type="checkbox" name="x" value="-1"> -1</label>
            <label><input type="checkbox" name="x" value="0"> 0</label>
            <label><input type="checkbox" name="x" value="1"> 1</label>
            <label><input type="checkbox" name="x" value="2"> 2</label>
            <label><input type="checkbox" name="x" value="3"> 3</label>
            <label><input type="checkbox" name="x" value="4"> 4</label>
        </td>
    </tr>
    <tr>
        <td>
            <p>Y:</p>
            <input type="text" name="y" id="y">
        </td>
    </tr>
    <tr>
        <td>
            <p>R:</p>
            <label><input type="checkbox" name="r" value="1"> 1</label>
            <label><input type="checkbox" name="r" value="2"> 2</label>
            <label><input type="checkbox" name="r" value="3"> 3</label>
            <label><input type="checkbox" name="r" value="4"> 4</label>
            <label><input type="checkbox" name="r" value="5"> 5</label>
            <button type="button" id="check">Проверить</button>
        </td>
    </tr>
    <tr>
        <td>
        </td>
        <td class = "pict">
            <canvas id="graph" width="400" height="400"></canvas>
        </td>
        <td class="output">
            <table class = "results">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Попадание</th>
                    <th>Текущее время</th>
                    <th>Время работы</th>
                </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
            <p id="error"></p>
        </td>
    </tr>
</table>

<audio controls autoplay loop>
    <source src="theme.mp3" type="audio/mpeg">
</audio>

<script src="index.js"></script>
</body>
</html>
